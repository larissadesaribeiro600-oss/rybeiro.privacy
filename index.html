<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagem importante</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:#000; color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
body:before{
  content:""; position:fixed; inset:-30%;
  background:radial-gradient(circle,#a000ff22 0%,transparent 35%);
  animation:pulse 3s ease-in-out infinite;
}
.wrap{position:relative;text-align:center;padding:30px}
.loading{
  font-size:18px;letter-spacing:3px;color:#c0f;
  text-shadow:0 0 12px #c0f;animation:flicker 1.4s infinite
}
.loader{
  margin:28px auto;width:220px;height:4px;background:#171717;
  overflow:hidden;box-shadow:0 0 15px #a000ff
}
.loader span{
  display:block;width:45%;height:100%;background:#ff00ff;
  box-shadow:0 0 18px #ff00ff;animation:load 2.7s linear forwards
}
.final{display:none}
.final h1{
  margin:0;font-size:clamp(45px,11vw,105px);line-height:.9;
  letter-spacing:4px;color:#ff00ff;
  text-shadow:0 0 5px #fff,0 0 12px #ff00ff,
              0 0 30px #ff00ff,0 0 65px #8b00ff;
  animation:dramatic .8s ease-out
}
@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(500%)}}
@keyframes pulse{50%{transform:scale(1.2);opacity:.55}}
@keyframes flicker{50%{opacity:.45}}
@keyframes dramatic{
  0%{opacity:0;transform:scale(.35) rotate(-2deg);filter:blur(15px)}
  70%{transform:scale(1.08)}
  100%{opacity:1;transform:scale(1);filter:blur(0)}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading">
    <div class="loading">ACESSANDO CONTEÚDO...</div>
    <div class="loader"><span></span></div>
  </div>

  <div id="final" class="final">
    <h1>VAI SE<br>FODER.</h1>
  </div>
</div>

<script>
setTimeout(()=>{
  document.getElementById("loading").style.display="none";
  document.getElementById("final").style.display="block";
},3000);
</script>
</body>
</html>
